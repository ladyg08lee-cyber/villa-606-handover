<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Villa 606 Handover Document System</title></head><body><div style="font-family:Arial,sans-serif;padding:30px">Loading Villa 606 Handover System…</div><script>
(async()=>{
try{
let h=await (await fetch('https://raw.githubusercontent.com/ladyg08lee-cyber/villa-606-handover/backup-before-edit-controls/index.html?'+Date.now())).text();
// All folders: always show edit + delete, including master folders.
h=h.replace(/const actions=f\.master===false\s*\?\s*`<div class="card-actions"><button class="icon-btn" title="Rename custom folder" onclick="openEdit\(\$\{i\}\)">✎<\/button><button class="icon-btn" title="Delete custom folder" onclick="deleteFolder\(\$\{i\}\)">×<\/button><\/div>`\s*:\s*'';\s*const lock=f\.master!==false\?'<span class="locked">Master folder<\/span>':'';\s*c\.innerHTML=`\$\{actions\}<div class="card-folder">▰<\/div><div class="card-name">\$\{esc\(f\.name\)\} \$\{lock\}<\/div>/,
'const actions=`<div class="card-actions"><button class="icon-btn" title="Edit folder name" onclick="openEdit(${i})">✎</button><button class="icon-btn" title="Delete folder" onclick="deleteFolder(${i})">×</button></div>`; c.innerHTML=`${actions}<div class="card-folder">▰</div><div class="card-name">${esc(f.name)}</div>');
// Remove master-folder rename/delete locks.
h=h.replace("if(f.master!==false){alert('The approved Villa 606 master folder structure is locked.');return}\n  editIndex=i;","editIndex=i;");
h=h.replace("if(f.master!==false)throw new Error('Master folders cannot be renamed.');\n      const folderId=","const folderId=");
h=h.replace("if(f.master!==false){alert('The approved Villa 606 master folder structure is locked and cannot be deleted.');return}\n  if(!confirm(`Delete custom folder “${f.name}” from Google Drive?\\n\\nThe folder and everything inside it will be moved to Google Drive Trash.`))return;","if(!confirm(`Delete folder “${f.name}” from Google Drive?\\n\\nThe folder, its subfolders, and everything inside it will be moved to Google Drive Trash.`))return;");
// Make edit/delete buttons permanently visible.
h=h.replace('.icon-btn{width:25px;height:25px;border:0;border-radius:6px;background:#f1eee8;color:#615d56;display:none}', '.icon-btn{width:25px;height:25px;border:0;border-radius:6px;background:#f1eee8;color:#615d56;display:block}');
// Add document rename function before delete function if missing.
if(!h.includes('async function renameDriveFile(i)')){
const fn=`async function renameDriveFile(i){const f=(node().files||[])[i];if(!f||!f.id)return;const next=prompt('Edit document name:',f.name||'');if(next===null)return;const newName=next.trim();if(!newName||newName===f.name)return;if(!driveToken){alert('Connect Google Drive before renaming documents.');return}try{const updated=await driveJson('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?fields=id,name,modifiedTime,size,webViewLink,webContentLink',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName})});f.name=updated.name||newName;if(updated.modifiedTime)f.modifiedTime=updated.modifiedTime;render();await saveData()}catch(e){alert('Document rename failed. '+friendlyError(e))}}\n`;
h=h.replace('async function deleteDriveFile(i){',fn+'async function deleteDriveFile(i){');}
// Add document edit/delete controls to rendered PDF cards.
h=h.replace(/c\.innerHTML=`<div class="file-icon">📄<\/div><div class="card-name">\$\{esc\(f\.name\)\}<\/div><div class="card-meta">\$\{esc\(f\.sizeText\|\|'PDF'\)\} • Google Drive<\/div><div class="file-date">Modified \$\{esc\(formatDate\(f\.modifiedTime\)\)\}<\/div><div class="file-actions"><button onclick="viewDriveFile\(\$\{i\}\)">View PDF<\/button><button onclick="downloadDriveFile\(\$\{i\}\)">Download<\/button><button onclick="deleteDriveFile\(\$\{i\}\)">Delete from Drive<\/button><\/div>`;/,
'c.innerHTML=`<div class="card-actions"><button class="icon-btn" title="Edit document name" onclick="renameDriveFile(${i})">✎</button><button class="icon-btn" title="Delete document" onclick="deleteDriveFile(${i})">×</button></div><div class="file-icon">📄</div><div class="card-name">${esc(f.name)}</div><div class="card-meta">${esc(f.sizeText||\'PDF\')} • Google Drive</div><div class="file-date">Modified ${esc(formatDate(f.modifiedTime))}</div><div class="file-actions"><button onclick="viewDriveFile(${i})">View PDF</button><button onclick="downloadDriveFile(${i})">Download</button><button onclick="renameDriveFile(${i})">Edit Name</button><button onclick="deleteDriveFile(${i})">Delete</button></div>`;');
// Rename modal wording.
h=h.replace("document.getElementById('modalTitle').textContent='Rename Custom Folder';","document.getElementById('modalTitle').textContent='Edit Folder Name';");
h=h.replace("document.getElementById('modalTitle').textContent='Add Custom Folder';","document.getElementById('modalTitle').textContent='Add Folder';");
document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div style="font-family:Arial;padding:30px"><h2>Villa 606 Handover System</h2><p>Unable to load the portal. Please refresh the page.</p><pre>'+String(e)+'</pre></div>';}
})();
</script></body></html>
